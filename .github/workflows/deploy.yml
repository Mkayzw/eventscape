name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/mkayzw/eventscape

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, web, worker, db-init]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Coolify redeploys every resource tagged "eventscape", pulling the new :latest images.
      - name: Trigger Coolify deploy
        run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "${{ vars.COOLIFY_URL }}/api/v1/deploy?tag=eventscape"
